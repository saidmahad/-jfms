# JUPA Fuel Station Management System — Render blueprint
# Deploy with: https://render.com → New → Blueprint → select this repo
# Replace the example URLs below with your actual service URLs.

services:
  - type: web
    name: jfms-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run db:setup
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        value: https://jfms-app.onrender.com # <- your frontend URL

  - type: web
    name: jfms-app
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://jfms-api.onrender.com # <- your backend URL
