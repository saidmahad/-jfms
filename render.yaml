# JUPA Fuel Station Management System — Render blueprint
# Deploy with: https://render.com → New → Blueprint → select this repo
#
# The backend serves both the REST API and the bundled React frontend,
# so the whole system runs from a single origin (no CORS, no SPA rewrites).

services:
  - type: web
    name: jfms-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build:client
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        value: https://jfms-api.onrender.com # same origin — API URL
